[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

# pre-commit hooks configuration; managed by the `pre-commit` package
[tool.pre-commit]
repos = [
  { repo = "https://github.com/charliermarsh/ruff-pre-commit", rev = "v0.0.241", hooks = [{ id = "ruff" }] },
  { repo = "https://github.com/pre-commit/pre-commit-hooks", rev = "v4.0.1", hooks = [
      { id = "check-yaml" },
      { id = "end-of-file-fixer" }
    ]
  }
]
